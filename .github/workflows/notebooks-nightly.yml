name: notebooks-nightly

# Pull requests execute only the three lightweight notebooks, to keep the
# feedback loop short. This job runs the whole set, so the nine that CI does not
# cover cannot rot unnoticed — as some had before the June 2026 repair.

on:
  schedule:
    # 04:15 UTC daily, comfortably outside working hours in Europe.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare benchmark dataset
        run: make data

      - name: Execute every notebook
        run: make notebooks-all

  report-failure:
    needs: execute
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update an issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly notebook execution is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled run of `make notebooks-all` failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Common causes, roughly in order of likelihood:',
              '',
              '- A dependency release changed behaviour an estimator relies on.',
              '- The upstream Lalonde CSV moved or changed shape.',
              '- A notebook drifted from the estimator API it calls.',
              '',
              'This issue is reopened rather than duplicated on each failure.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'notebooks,automated',
            });
            const match = existing.data.find((issue) => issue.title === title);

            if (!match) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'notebooks', 'automated'],
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body,
            });
            if (match.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'open',
              });
            }
