# Run `pre-commit install` once; hooks then run on every commit.
# Update pinned revisions with `pre-commit autoupdate`.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ipynb$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
        # mkdocs.yml carries !!python/name: tags that safe_load rejects by
        # design; MkDocs resolves them itself.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.bat$
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      # Notebooks are committed without outputs. Outputs are regenerated by
      # `make notebooks`, the nightly workflow, and the documentation build.
      - id: nbstripout

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - numpy>=1.24
          - pandas-stubs>=2.0
          - types-PyYAML
