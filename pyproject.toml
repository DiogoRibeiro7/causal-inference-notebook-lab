[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-inference-notebook-lab"
version = "0.1.0"
description = "Notebook-first causal inference portfolio project with reusable Python source code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "causal-inference",
    "propensity-scores",
    "doubly-robust",
    "difference-in-differences",
    "instrumental-variables",
    "double-machine-learning",
    "reproducible-research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/causal-inference-notebook-lab"
ORCID = "https://orcid.org/0009-0001-2022-7072"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
    "pandas-stubs>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "reports", "notebooks", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["causal_inference_lab"]

[tool.mypy]
# No python_version pin: each CI matrix leg checks against its own interpreter. Pinning
# 3.10 made mypy reject PEP 695 syntax in the numpy stubs installed on the 3.12 runner.
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
