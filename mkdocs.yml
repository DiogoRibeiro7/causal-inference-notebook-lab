site_name: Causal Inference Notebook Lab
site_description: >-
  A notebook-first causal inference lab: reusable estimators, transparent
  assumptions, and analyses that state what they cannot conclude.
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/causal-inference-notebook-lab/
repo_url: https://github.com/DiogoRibeiro7/causal-inference-notebook-lab
repo_name: DiogoRibeiro7/causal-inference-notebook-lab
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Diogo Ribeiro — MIT licensed

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
  - mkdocs-jupyter:
      # docs/notebooks is generated by scripts/build_docs_notebooks.py, which
      # executes the canonical notebooks with `notebooks/` as the kernel's
      # working directory. Executing here instead would resolve their
      # PROJECT_ROOT to `docs/`, where src and scripts do not exist.
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      # Lets docs/about/*.md include CONTRIBUTING.md and CHANGELOG.md from the
      # repository root, so those files have one copy rather than two.
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7
    - icon: fontawesome/solid/id-card
      link: https://orcid.org/0009-0001-2022-7072
      name: ORCID

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Choosing an estimator: choosing-an-estimator.md
  - Assumptions matrix: assumptions.md
  - API reference:
      - Overview: api/index.md
      - Data generators: api/data_generators.md
      - Estimators: api/estimators.md
      - Matching: api/matching.md
      - Double machine learning: api/dml.md
      - Meta-learners: api/meta_learners.md
      - Difference-in-differences: api/difference_in_differences.md
      - Instrumental variables: api/instrumental_variables.md
      - Regression discontinuity: api/rdd.md
      - Synthetic control: api/synthetic_control.md
      - Diagnostics: api/diagnostics.md
      - Uncertainty: api/uncertainty.md
      - Sensitivity: api/sensitivity.md
      - Reporting: api/reporting.md
      - Plotting: api/plotting.md
  - Notebooks:
      - notebooks/00_project_overview.ipynb
      - notebooks/01_confounding_propensity_scores.ipynb
      - notebooks/02_doubly_robust_aipw.ipynb
      - notebooks/03_heterogeneous_treatment_effects.ipynb
      - notebooks/04_difference_in_differences.ipynb
      - notebooks/05_instrumental_variables.ipynb
      - notebooks/06_sensitivity_and_reporting.ipynb
      - notebooks/07_double_machine_learning.ipynb
      - notebooks/08_regression_discontinuity.ipynb
      - notebooks/09_synthetic_control.ipynb
      - notebooks/10_lalonde_job_training.ipynb
      - notebooks/11_policy_targeting.ipynb
      - notebooks/12_ihdp_benchmark.ipynb
  - Project:
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
      - Project summary: about/project_summary.md
      - Announcement draft: about/linkedin_post.md
